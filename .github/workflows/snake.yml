name: Generate pink contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E02A80&color_dots=#FFE3F1,#FFC2E2,#FF8DC7,#FF4FA3,#C91F7B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF4FA3&color_dots=#2A1245,#6B2A66,#B03A83,#FF4FA3,#FFC2E2

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
