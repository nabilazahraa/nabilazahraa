<text x="118" y="72" font-size="21" font-weight="800" fill="#122A4A">Careem</text>
<text x="118" y="95" font-size="14" font-weight="600" fill="#2A78E0">AI Software Engineer</text>
<text x="800" y="72" text-anchor="end" font-size="12.5" letter-spacing=".5" fill="#5A9AEE">Apr 2026 – Sep 2026</text><text x="118" y="122" font-size="13.5" fill="#3F5F8A">Built and migrated production AI agents to Careem's in-house agentic AI platform</text><text x="118" y="142" font-size="13.5" fill="#3F5F8A">(deep-agent architectures), integrated MCP servers and internal tooling, and helped</text><text x="118" y="162" font-size="13.5" fill="#3F5F8A">migrate CI/CD from Bitrise to GitHub Actions.</text><circle cx="62" cy="228" r="17" fill="#2A78E0" class="pulse" style="animation-duration:6s;animation-delay:-1.5s" opacity=".3" filter="url(#b3)"/>
<circle cx="62" cy="228" r="6.5" fill="url(#plv)" stroke="#9CC7FF" stroke-width="1.2"/>
<text x="118" y="222" font-size="21" font-weight="800" fill="#122A4A">Data Science Dojo</text>
<text x="118" y="245" font-size="14" font-weight="600" fill="#2A78E0">Associate GenAI Software Engineer</text>
<text x="800" y="222" text-anchor="end" font-size="12.5" letter-spacing=".5" fill="#5A9AEE">Jun 2025 – Mar 2026</text><text x="118" y="272" font-size="13.5" fill="#3F5F8A">Shipped production GenAI apps and RAG systems (FastAPI, Django, OpenAI, LangChain,</text><text x="118" y="292" font-size="13.5" fill="#3F5F8A">Azure AI Search). Cut API latency ~40% and sped up document indexing ~40%.</text><circle cx="62" cy="378" r="17" fill="#2A78E0" class="pulse" style="animation-duration:7s;animation-delay:-3s" opacity=".3" filter="url(#b3)"/>
<circle cx="62" cy="378" r="6.5" fill="url(#pl)" stroke="#9CC7FF" stroke-width="1.2"/>
<text x="118" y="372" font-size="21" font-weight="800" fill="#122A4A">Salesflo</text>
<text x="118" y="395" font-size="14" font-weight="600" fill="#2A78E0">Software Engineer</text>
<text x="800" y="372" text-anchor="end" font-size="12.5" letter-spacing=".5" fill="#5A9AEE">Sep 2024 – May 2025</text><text x="118" y="422" font-size="13.5" fill="#3F5F8A">Built an AI route-optimization platform for FMCG field teams on AWS. Cut travel time</text><text x="118" y="442" font-size="13.5" fill="#3F5F8A">by 30%.</text></g><rect x=".5" y=".5" width="829" height="487" rx="18" fill="none" stroke="rgba(42,120,224,0.32)"/></svg>