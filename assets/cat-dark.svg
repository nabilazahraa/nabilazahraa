.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.head{transform-origin:230px 170px;animation:head 3.5s ease-in-out infinite}
@keyframes head{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
