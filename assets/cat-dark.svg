<svg xmlns="http://www.w3.org/2000/svg" width="460" height="260" viewBox="0 0 460 260" role="img" aria-labelledby="t"><title id="t">A cat with a laptop waving and saying: Hi, I'm Nabila!</title>
<defs><linearGradient id="lid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F9BFF"/><stop offset="1" stop-color="#7BB4FF"/></linearGradient>
<style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wave{transform-origin:284px 182px;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(18deg)}}
.tail{transform-origin:170px 232px;animation:tail 3s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.blink{transform-origin:230px 118px;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bob{animation:bob 3s ease-in-out infinite}
